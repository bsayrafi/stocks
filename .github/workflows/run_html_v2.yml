name: Run HTML V2

# This allows you to run it manually with a button click
on:
  workflow_dispatch:

# Never run two screeners at once (they would race on the cache)
concurrency:
  group: run_html_v2
  cancel-in-progress: false

jobs:
  run-html2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Download your repository files (including your custom .py files and cache_store.py)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.10
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3a: Restore the saved virtualenv (key changes only when requirements.txt or Python changes)
      - name: Restore virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      # Step 3b: Only on a cache miss - install with uv (much faster than pip)
      - name: Set up uv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          uv venv .venv --python "${{ steps.py.outputs.python-path }}"
          uv pip install --python .venv -r requirements.txt

      # Step 3c: Make `python` in later steps use the virtualenv
      - name: Activate virtualenv
        run: |
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      # Step 3d: Today's date in UTC. The runner clock is UTC, so this matches
      # date.today() in cache_store.py - both roll over at the same moment.
      - name: Get cache date
        id: cachedate
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Step 3e: Restore the newest cache saved earlier TODAY (if any).
      # Cache keys are immutable, so each run saves under its own run_id and
      # we restore by prefix - GitHub returns the most recent match.
      # No match (first run of the day) -> empty htmlv2cache/ -> everything is fetched.
      # htmlv2cache/ holds the WHOLE shared cache (cache_store.py): the Finviz screener result,
      # yfinance .info / analyst / earnings per ticker, the S&P 500 list, news (1 h) and
      # finished Alpaca extended-hours windows.
      - name: Restore daily cache
        uses: actions/cache/restore@v4
        with:
          path: htmlv2cache
          key: htmlv2cache-${{ steps.cachedate.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            htmlv2cache-${{ steps.cachedate.outputs.today }}-

      # Step 4: Run your cleaned Python script
      - name: Run HTML V2 Script
        env:
          # Injects the secret we created earlier!
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # API keys - used when constants.CONFIG doesn't provide them
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # The one shared cache folder for every script (read by cache_store.py)
          CACHE_DIR: ${{ github.workspace }}/htmlv2cache

        # IMPORTANT: Make sure this matches the exact name of your main script file
        run: |
          mkdir -p reports
          mkdir -p data
          mkdir -p htmlv2cache
          python run_trend_entry.py

      # Step 4.2: Save the cache for later runs today (also after a failed run: what was fetched is kept)
      - name: Save daily cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: htmlv2cache
          key: htmlv2cache-${{ steps.cachedate.outputs.today }}-${{ github.run_id }}

      # Step 4.5: Generate the date (Day-Month)
      - name: Get current date
        run: echo "DATE=$(date +'%m_%d_%H_%M')" >> $GITHUB_ENV

      # Step 5: Save the generated Excel files as Artifacts
      - name: Upload Reports Output
        uses: actions/upload-artifact@v4
        with:
          name: HTMLV2Signal_Results_${{ env.DATE }}
          path: |
            reports/*.html
            reports/*.csv
          retention-days: 1
