name: run FairValueGapSignal

on:
  # schedule:
    # Runs hourly, 13:00-21:00 UTC, Mon-Fri. This window covers US market
    # hours (9:30am-4pm ET) under BOTH EDT (UTC-4) and EST (UTC-5), so it
    # doesn't need manual adjustment when US clocks change in Nov/March —
    # a few runs will land outside actual trading hours depending on the
    # season, but fvg_live_signal.py handles "no new bar yet" gracefully
    # (just reports nothing new), so those extra runs are harmless.
    # - cron: '5 13-21 * * 1-5'
    # - cron: '*/5 * * * *'
    # - cron: '05 17 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated log back to the data branch

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (source code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch (model + log) into a separate folder
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Stage model + log from the data branch
        run: |
          mkdir -p models logs
          cp data-branch/models/fvg_quality_model_hourly.joblib models/fvg_quality_model_hourly.joblib
          cp data-branch/logs/fvg_signals.csv logs/fvg_signals.csv

      - name: Run FVG scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 fvg_live_signal.py --sector Technology --exclude-macro

      - name: Commit updated log back to the data branch
        run: |
          cp logs/fvg_signals.csv data-branch/logs/fvg_signals.csv
          cd data-branch
          git config user.name "fvg-bot"
          git config user.email "fvg-bot@users.noreply.github.com"
          git add logs/fvg_signals.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update signal log $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
